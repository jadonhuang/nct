<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title></title>
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <script src="<%= BASE_URL %>lib/signalr/signalr.min.js"></script>
    <%if (process.env.NODE_ENV == "development") {%>
    <script src="http://localhost:3838/apiscriptproxy"></script>
    <!--<script src="http://localhost:3838/core/apiscriptproxy?addmoduleprefix=true"></script>
    <script src="http://localhost:3838/form/apiscriptproxy?addmoduleprefix=true"></script>
    <script src="http://localhost:3838/flow/apiscriptproxy?addmoduleprefix=true"></script>-->
    <%} else{%>
    <script src="/apiscriptproxy"></script>
    <%}%>
    <!--<script src="//api.map.baidu.com/api?type=webgl&v=1.0&ak=FqCzv8dkygjoe7dPZfp6ZAty"></script>-->
</head>
<body>
    <noscript>
        <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
 
    <div id="app">

        <div class="loading">
            <img src="<%= BASE_URL %>img/loading.gif" />
            <div class="title">
                资源加载中
            </div>
            <div class="sub-title">
                初次加载资源可能需要较长时间，请耐心等待。
            </div>

        </div>
        <style>

            .loading {
                display: flex;
                justify-content: center;
                align-items: center;
                font-family: Arial;
                flex-direction: column;
                height: 100vh;
            }

                .loading img {
                    margin-bottom: 10px;
                    height: 24px;
                }

            .title {
                color: #808080;
                font-size: 16px;
                margin-bottom: 10px;
            }

            .sub-title {
                color: #ABABAB;
                font-size: 12px
            }

            body {
                padding: 0;
                margin: 0;
            }
        </style>

    </div>
    <!-- built files will be auto injected -->
</body>
</html>
